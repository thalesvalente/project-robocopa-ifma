name: I2 - árbitro e bots separados
on:
  pull_request:
    paths:
      - 'specs/004-isolamento-execucao/iteration-2.md'
      - 'specs/004-isolamento-execucao/i2-protocol-clarification.md'
      - 'specs/004-isolamento-execucao/i2-cleanup-scenarios.md'
      - 'spikes/isolamento/engine-separation/**'
      - 'services/worker_agent/game_policy.py'
      - 'scripts/run_engine_separation.py'
      - 'tests/security/**'
      - '.github/workflows/engine-separation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Regressões e contratos antes da execução real
        run: |
          python3 scripts/verify_security_spec.py
          python3 -m unittest discover -s tests/planning -v
          python3 -m unittest discover -s tests/infra -v
          python3 -m unittest discover -s tests/tank_royale -v
          python3 -m unittest discover -s tests/mobile -v
          python3 -m unittest discover -s tests/security -v
      - name: Spec Kit nativo
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/004-isolamento-execucao
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: python3 .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
  separated-battle:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Batalha real em quatro contêineres com gateway e negativos de rede/protocolo
        run: python3 scripts/run_engine_separation.py
      - name: Verificar timeout externo e limpeza em invocação separada
        run: python3 scripts/run_engine_separation.py --timeout-cleanup-check
      - name: Preservar apenas evidências sanitizadas desta invocação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i2-separated-battle-evidence
          path: |
            .local/engine-separation/**/report.json
            .local/engine-separation/**/results.json
            .local/engine-separation/**/recordings/*.battle.gz
            .local/engine-separation/**/engine.log
            .local/engine-separation/**/build-*.log
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
