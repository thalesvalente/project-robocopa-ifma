name: I2 reconciliation - tracked source audit
on:
  push:
    branches: [feat/s04-i2-separated-arena]
    paths: ['.github/workflows/i2-reconciliation-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only tracked files of frozen revisions - no runtime execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/i2-source-audit
          for pair in 'pr19 3f1b4950ccf229ad90ff27b3636575aad0ca5c57' 'pr21 583fe580b69f29931c90d66abbc0fd2571a4ff86' 'pr18 e94ac97ff7c3f16b7b7a4a3b38d41df640251ff8'; do
            read -r label revision <<< "$pair"
            git cat-file -e "$revision^{commit}"
            git archive --format=tar "$revision" > "/tmp/i2-source-audit/$label.tar"
            git ls-tree -r "$revision" > "/tmp/i2-source-audit/$label-tree.txt"
            printf '%s %s\n' "$label" "$revision" >> /tmp/i2-source-audit/revisions.txt
          done
          sha256sum /tmp/i2-source-audit/*.tar > /tmp/i2-source-audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i2-reconciliation-tracked-source
          path: /tmp/i2-source-audit/
          retention-days: 7
          if-no-files-found: error
# Temporary read-only collector authorized by i2-reconciliation-plan.md R01.
# No Docker, bot process, secrets export, host access or repository write token.
