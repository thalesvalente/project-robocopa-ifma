name: I3-03 - PostgreSQL real, leases e fencing
on:
  pull_request:
    paths:
      - '.github/workflows/i3-postgres.yml'
      - 'services/execution_control/postgres/**'
      - 'tests/postgres/**'
      - 'specs/004-isolamento-execucao/i3-03*'
      - 'specs/004-isolamento-execucao/contracts/postgres-control.md'
      - 'docs/qualidade/evidencias/S04-T04-I3-03*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i3-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RC_PG_CONTAINER: robocopa-i3pg-${{ github.run_id }}-${{ github.run_attempt }}
      RC_PG_VOLUME: robocopa-i3pg-data-${{ github.run_id }}-${{ github.run_attempt }}
      RC_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: PostgreSQL isolado, sem portas e sem rede
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker info >/dev/null
          docker volume create --label "org.robocopa.i3pg.run=$GITHUB_RUN_ID" "$RC_PG_VOLUME"
          PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d --name "$RC_PG_CONTAINER" --label "org.robocopa.i3pg.run=$GITHUB_RUN_ID" \
            --network none --memory 512m --cpus 1 --pids-limit 128 \
            --mount "type=volume,source=$RC_PG_VOLUME,target=/var/lib/postgresql/data" \
            -e POSTGRES_DB=robocopa_i3_ci -e "POSTGRES_PASSWORD=$PASSWORD" \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
            postgres -c shared_buffers=32MB -c max_connections=20
          unset PASSWORD
          # The image's temporary initialization server has no TCP listener.
          # This probe is INSIDE the network-none container, not a host port.
          for i in $(seq 1 60); do
            if docker exec "$RC_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d robocopa_i3_ci; then break; fi
            sleep 1
          done
          docker exec "$RC_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d robocopa_i3_ci
          # Readiness alone does not prove the database/user exists. Test real SQL.
          test "$(docker exec --user postgres "$RC_PG_CONTAINER" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d robocopa_i3_ci -c 'SELECT 1')" = 1
      - name: Transacoes, races, acesso negado, leases e restart reais
        run: python3 tests/postgres/test_control.py
      - name: Regressao de planejamento e Spec Kit nativo
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/004-isolamento-execucao
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: |
          python3 scripts/verify_security_spec.py
          python3 scripts/render_planning.py
          python3 scripts/verify_planning.py
          python3 .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
          git diff --exit-code
      - name: Limpeza apenas dos recursos desta execucao, comprovada
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FOUND="$(docker ps -a --filter "name=^/${RC_PG_CONTAINER}$" --format '{{.Names}}')"
          if [ -n "$FOUND" ]; then
            test "$(docker inspect -f '{{index .Config.Labels "org.robocopa.i3pg.run"}}' "$RC_PG_CONTAINER")" = "$GITHUB_RUN_ID"
            docker rm -f "$RC_PG_CONTAINER"
          fi
          FOUND="$(docker volume ls --filter "name=^${RC_PG_VOLUME}$" --format '{{.Name}}')"
          if [ -n "$FOUND" ]; then
            test "$(docker volume inspect -f '{{index .Labels "org.robocopa.i3pg.run"}}' "$RC_PG_VOLUME")" = "$GITHUB_RUN_ID"
            docker volume rm "$RC_PG_VOLUME"
          fi
          test -z "$(docker ps -a --filter "label=org.robocopa.i3pg.run=$GITHUB_RUN_ID" -q)"
          test -z "$(docker volume ls --filter "label=org.robocopa.i3pg.run=$GITHUB_RUN_ID" -q)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('.local/i3-postgres/report.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          report=json.loads(path.read_text()) if path.exists() else {'status':'NOT_RUN'}
          report['cleanup']='VERIFIED'
          path.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i3-postgres-evidence
          path: .local/i3-postgres/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
# No Supabase credentials, public endpoint, student bot, local VM or personal DB.
