name: Feature 005 - Google academico IFMA (planejamento)

on:
  pull_request:
    paths:
      - 'specs/005-identidade-academica/**'
      - 'specs/README.md'
      - 'docs/arquitetura/ADR-007-autenticacao-google-academica.md'
      - 'docs/arquitetura/ADR-008-google-multiescolas.md'
      - 'docs/planejamento/decisoes/D-010-login-google-academico-ifma.md'
      - 'docs/planejamento/decisoes/D-011-google-pessoal-multiescolas.md'
      - 'services/identity/**'
      - 'tests/identity/**'
      - 'docs/planejamento/ESTADO-ATUAL.md'
      - '.github/workflows/identity-academica-spec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-feature:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar prerequisites nativos do Spec Kit 005
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/005-identidade-academica
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: python3 .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
      - name: Verificar planejamento canonico e documentos
        run: |
          python3 scripts/render_planning.py
          git diff --exit-code -- docs/planejamento/PLANO-MESTRE.md docs/planejamento/sprints
          python3 scripts/verify_planning.py
          python3 scripts/verify_deliverables.py
          python3 -m unittest discover -s tests/planning -v
          python3 -m unittest discover -s tests/identity -v
          git diff --exit-code
# Documentação apenas: não faz login no Google, importa alunos nem emite tokens.
