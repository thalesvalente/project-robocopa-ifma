name: Planejamento e requisitos do Spec Kit

on:
  push:
    branches: [main, chore/s00-fundacao-speckit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planejamento-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter o commit em revisão
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Conferir projeções do backlog
        run: |
          python3 scripts/render_planning.py
          git diff --exit-code -- docs/planejamento/PLANO-MESTRE.md docs/planejamento/sprints
          python3 scripts/verify_planning.py
      - name: Executar testes de planejamento e preservação
        run: python3 -m unittest discover -s tests/planning -v
      - name: Conferir minutas e links locais
        run: python3 scripts/verify_deliverables.py
      - name: Executar verificação nativa de pré-requisitos do Spec Kit
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/000-governanca
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: python3 .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
      - name: Confirmar ausência de alterações rastreadas
        run: git diff --exit-code
